      <text x="20" y="236" fill="#aab3c4" font-size="13">Fullscreen, slideshow, image info</text>
    </g>
    <g transform="translate(122 436)">
      <rect width="630" height="72" rx="14" fill="#f7f9fc" stroke="#e2e6ef"/>
      <rect x="22" y="22" width="96" height="28" rx="14" fill="#e8eefb"/>
      <text x="44" y="41" fill="#2f6fed" font-size="13" font-weight="800">name up</text>
      <rect x="132" y="22" width="94" height="28" rx="14" fill="#edf2f0"/>
      <text x="154" y="41" fill="#178a5b" font-size="13" font-weight="800">date</text>
