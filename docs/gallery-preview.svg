<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Local Gallery Viewer preview</title>
  <desc id="desc">A representative browser gallery interface with folder cards, thumbnails, and a reader panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ed"/>
      <stop offset="0.55" stop-color="#eef5f1"/>
      <stop offset="1" stop-color="#edf1fa"/>
    </linearGradient>
    <linearGradient id="coverA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#18a07a"/>
    </linearGradient>
    <linearGradient id="coverB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb24a"/>
      <stop offset="1" stop-color="#da5c5c"/>
    </linearGradient>
    <linearGradient id="coverC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242f"/>
      <stop offset="1" stop-color="#67718a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2b3038" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="80" y="70" width="1120" height="580" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="80" y="70" width="1120" height="76" rx="28" fill="#171b22"/>
  <rect x="80" y="118" width="1120" height="28" fill="#171b22"/>
  <circle cx="119" cy="108" r="8" fill="#ff6868"/>
  <circle cx="145" cy="108" r="8" fill="#ffc14f"/>
  <circle cx="171" cy="108" r="8" fill="#54c77d"/>
  <text x="216" y="116" fill="#f6f8fb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Local Gallery Viewer</text>
  <rect x="882" y="91" width="122" height="34" rx="17" fill="#2f6fed"/>
  <text x="907" y="114" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Choose folder</text>
  <rect x="1018" y="91" width="124" height="34" rx="17" fill="#2b3038"/>
  <text x="1048" y="114" fill="#d8dde8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Settings</text>
  <text x="122" y="190" fill="#252a34" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Photo Archive</text>
  <text x="122" y="220" fill="#687083" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Folders first, then media. Everything stays on this device.</text>
