      <path d="M18 180h266v-56c-34-12-64-7-91 15-31 25-68 22-101 4-29-16-52-13-74 8z" fill="#66b393" opacity="0.7"/>
      <circle cx="222" cy="62" r="26" fill="#f3b34d" opacity="0.9"/>
